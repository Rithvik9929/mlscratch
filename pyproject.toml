[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlscratch"
version = "0.1.0"
description = "Classical ML algorithms implemented from scratch in NumPy, validated against scikit-learn"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "scikit-learn", "matplotlib", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100